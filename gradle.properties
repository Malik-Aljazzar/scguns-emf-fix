## Mod Properties

mod_id=scguns_emf_fix
mod_name=ScorchedGuns EMF Compat Perf Fix
# No upstream license applies (this is new, standalone code, not a fork) - MIT.
mod_license=MIT
mod_version=1.1.0
mod_group_id=dev.malik.scgunsemffix

# ScorchedGuns: version actually deployed (mods folder). Client-side only - the bug
# (OptionalClientCompat.isEntityModelFeaturesFirstPersonHand/getEntityModelFeaturesContextEntity/
# isScorchedGunHeldByEntityModelFeaturesContext all do an uncached Class.forName + reflective
# field/method lookup on EVERY call, instead of caching like the class's own
# isEntityModelFeaturesLoaded() already does for a similar check) runs on EMF's per-model-part
# animate hook - fires for every part of every EMF-animated entity, every frame. Confirmed via
# spark profiler (Render thread) correlating 60->10 FPS drops with villager crowds; confirmed via
# javap against the real deployed jar, not guessed.
scguns_version=1.5

# Compile-time dependency coordinates (never shipped - see build.gradle):
# ScorchedGuns Neoforged 1.5 from CurseMaven, by CurseForge file id (project 1538807, file 8299074 = ScorchedGuns-1.5.jar).
scguns_curseforge_file_id=8299074
# EMF 3.3.12 / ETF 7.2.6 (NeoForge 1.21) from Modrinth's maven, by version id.
emf_modrinth_version=197m3VoU
etf_modrinth_version=lwNx1nD1

